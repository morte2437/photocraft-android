# Corpus numbers come from crates/io/tests/it/corpus.rs, not from here.
# Statuses must be true on main. Verified against 4b53f62 on 2026-10-05 (smart objects: #215 PR).
area = "file"
title = "File compatibility"
order = 2

[[item]]
id = "FILE-215-1"
target = "Smart Objects export as embedded Smart Objects (SoLd + lnk2), not flat pixels"
status = "done"
issue = 215
note = "psd_export.rs smart_blocks: PlLd + SoLd, source in lnk2 (.pcraft -> PSB); engine tests/it/smart_psd.rs; Photoshop 2026 opens 8/16-bit exports as live smart objects. Linked files are embedded"

