# Performance budgets for `cargo xtask perf` and the scorecard (#221).
#
# Targets come from #209 (interactive edits), #210 (long operations) and #211 (slow algorithms).
# Each [[scenario]] is measured by one row of one bench (`bench` + `row`, the row's exact name
# in the bench's `--json` report), judged on `metric` (p50 | p95 | max; default p95) against
# `budget_ms`. `enforce = false` marks a target the code doesn't meet yet: it is reported as
# "over budget" but only a regression fails the run; flip it to true in the PR that meets it.
# Scenarios the code can't support yet carry `not_measurable` (why) instead of a bench: never
# invent a number for them.
#
# Benches run in release with `--json <file>` appended. `quick_args` = also runs in
# `cargo xtask perf --quick` (small synthetic documents; budgets don't apply there).

[settings]
# A scenario regresses when its p50 grows by more than this share of the baseline…
regression_pct = 15.0
# …and by more than this many milliseconds (timer noise on very fast rows).
regression_min_ms = 1.0
# A run whose 1-minute load at the start is above this many per core is contended: its numbers
# measure the machine's load, so `--update-baseline` refuses it (`--allow-contended` records it,
# labelled as contended, and the scorecard says so).
max_load_per_core = 1.0
# `--update-baseline --from <results.json>...` needs at least this many saved runs. Each scenario
# gets the median p50 and the highest (the noise ceiling regressions are judged against).
baseline_min_runs = 5
# `--from` lists a budget as "could enforce" when its metric stays within this share of the
# budget in every run.
enforce_margin = 0.6

[[bench]]
name = "perf_scenarios"
package = "photocraft-ui-egui"
quick_args = ["--quick"]
note = "the #209/#210/#211 rows: layered 20 MP, 150 layers, 16/32-bit, open, retouch, selection"

[[bench]]
name = "perf_scenarios_cpu"
package = "photocraft-ui-egui"
example = "perf_scenarios"
args = ["--cpu", "--group", "layered"]
quick_args = ["--quick", "--cpu", "--group", "layered"]
note = "the layered #209 rows on the forced CPU compositor (#9330); run with perf_scenarios so the machine class keeps the GPU"

[[bench]]
name = "interactive_bench"
package = "photocraft-ui-egui"
args = ["--reps", "5"]
note = "36 MP photo: dabs, filters, adjustment previews, saves"

[[bench]]
name = "fx_bench"
package = "photocraft-ui-egui"
args = ["--no-cpu", "--reps", "5"]
note = "36 MP document with layer effects, GPU compositor"

[[bench]]
name = "bevel_bench"
package = "photocraft-ui-egui"
args = ["--reps", "9"]
quick_args = ["--size", "1200x800", "--reps", "3"]
note = "chisel bevel size change (a dragged slider) on a 12 MP ellipse and a text paragraph, GPU canvas and CPU"

[[bench]]
name = "camera_raw_bench"
package = "photocraft-ui-egui"
quick_args = ["--quick"]
note = "36 MP dense RGB layer: CPU develop, histogram, ICC vectorscope, clipping, nine Lab probes and egui tessellation; excludes GPU upload/presentation"

[[bench]]
name = "type_bench"
package = "photocraft-ui-egui"
quick_args = ["--size", "2000x1500", "--layers", "20", "--steps", "15"]
note = "font-size drag on 50 type layers"

[[bench]]
name = "large_image_bench"
package = "photocraft-ui-egui"
args = ["--size", "14000x14000", "--op", "refresh"]
note = "196 MP: open and full refresh"

[[bench]]
name = "large_file_bench"
package = "photocraft-ui-egui"
args = ["--reps", "3"]
note = "generated 2 GB PSD and 4.4 GB PSB (6.4 GB cached in <target>/fixtures): read + decode + open; needs ~30 GB of memory (the PSB)"

# Hook: the layout-document bench lands with perf/layout-documents (#125/#128). It runs (and its
# rows are kept in results.json) as soon as the example exists; add scenarios for its rows then.
[[bench]]
name = "layout_bench"
package = "photocraft-ui-egui"
requires = "crates/ui-egui/examples/layout_bench.rs"
quick_args = []
note = "layout PSDs with many styled layers (#125/#128)"

# Photomerge (#7758): the bounded-band algorithm must remain fast and its process-level
# resident-set high-water mark is tracked (on every desktop OS). No uncalibrated budget is
# enforced. Full mode uses 4 x 2 MP so ordinary CI machines do not allocate multi-GB blends;
# use the stand-alone example for the 4 x 24 MP stress test.
[[bench]]
name = "bench_multiband"
package = "photocraft-algo"
args = ["4", "2", "--reps", "5"]
quick_args = ["2", "0.25", "--reps", "3"]
note = "synthetic Photomerge multi-band blend; resident-set peak includes input/output buffers"

