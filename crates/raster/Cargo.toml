[package]
name = "photocraft-raster"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
photocraft-geom = { workspace = true }
photocraft-color = { workspace = true }
serde = { workspace = true }
crc32fast = "1"
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode"] }

# Native only: converting a region's tiles is independent per tile, so it runs on all cores;
# sysinfo reads the physical RAM size for the memory limit and the scratch volume's free space.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }
sysinfo = { version = "=0.40.1", default-features = false, features = ["system", "disk"] }

# Available physical memory and commit headroom (memory/system.rs) through winsafe's safe
# `GlobalMemoryStatusEx` wrapper.
[target.'cfg(windows)'.dependencies]
winsafe = { version = "=0.0.29", default-features = false, features = ["kernel"] }

[dev-dependencies]
proptest = { workspace = true }
